name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp frontend/styles.css frontend/app.js frontend/config.js _site/
          # 真实版作为站点入口：直连 WorkBuddy 云服务（登录、卡片海、看过即消失）
          cp frontend/index.html _site/index.html
          # 演示版保留在 /demo.html：localStorage 本地后端，零门槛试玩
          # （踩坑记录：cp 多源文件的目标必须是目录，不能是文件路径——曾在这里翻车）
          cp frontend/local-backend.js _site/
          cp frontend/demo.html _site/demo.html
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4