name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp frontend/styles.css frontend/config.js frontend/local-backend.js frontend/app.js _site/
          # 站点根入口 = 演示版：localStorage 本地后端，零门槛试玩，不依赖云端
          # （真实版住 WorkBuddy 托管域：云端 Origin 安全策略只放行应用自己的域名，
          #   GitHub Pages 域名下真实版无法登录，故不部署到 Pages，避免误导访客）
          cp frontend/demo.html _site/index.html
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4