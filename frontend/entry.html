<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>孤岛浪花 · 正在登岛</title>
  <meta name="description" content="每个人都是一座孤岛。把想说的话写成卡片，它会漂进某一片海，被某一个人看到一次，然后永远退去。" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A1214'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23E0A24A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E0A24A' stroke-width='1' opacity='.5'/%3E%3C/svg%3E" />
  <style>
    /* ============================================================
       登岛中转页
       ------------------------------------------------------------
       为什么需要这一页：
       真实版托管在 WorkBuddy 域，平台层有一道访问门禁——
       请求里必须带对 sharecode 参数，否则整页会被替换成
       「链接不完整」的拦截页（HTTP 403）。这是平台行为，
       我们的代码根本不会被送达浏览器，所以真实版自己
       无法「检测缺参数再跳转」。

       但门禁种了一枚 Cookie（__wb_rsc）：带对一次 sharecode，
       之后一个月内该浏览器免检。

       而 sharecode 只能放在 query 里 —— query 恰恰是聊天工具
       转发时最容易截断的部分（「链接不完整」页面的第一条建议
       就是「可能已被截断」）。

       所以解法是把这一页放在没有门禁的 GitHub Pages 上：
       它的 URL 一个参数都没有，截断无从发生；
       完整链接由脚本在运行时拼出来，永不缺失。

       注意：这里的样式是自包含的，不引用 styles.css——
       中转页要在任何环境下都能独立渲染出来。

       sharecode 与 README、config.js 保持一致，由 test/smoke.js
       断言三者相同，避免改了一处忘了另一处。
       ============================================================ */
    :root {
      --hull:   #0A1214;
      --panel:  #121E21;
      --line:   #223034;
      --line-2: #2A3C40;
      --foam:   #D6E3E0;
      --gauge:  #8A9C9A;
      --dim:    #5E7378;
      --signal: #E0A24A;
      --serif:  "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", "宋体", Georgia, serif;
      --mono:   "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
      --sans:   "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--hull);
      color: var(--foam);
      font-family: var(--sans);
      display: flex; align-items: center; justify-content: center;
      padding: 28px;
      /* 一点点纵深：右上角观测站的冷光，底部沉下去 */
      background-image:
        radial-gradient(90% 60% at 78% 4%, rgba(47, 111, 126, .22), transparent 62%),
        radial-gradient(120% 90% at 50% 110%, rgba(4, 9, 10, .6), transparent 60%);
    }

    .wrap { width: 100%; max-width: 640px; }

    /* 灯塔：琥珀色信号灯，扫过一圈 */
    .beacon {
      position: relative; width: 66px; height: 66px; margin-bottom: 26px;
    }
    .beacon .core {
      position: absolute; left: 50%; top: 50%; width: 9px; height: 9px;
      margin: -4.5px 0 0 -4.5px; border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 14px 3px rgba(224, 162, 74, .55);
    }
    .beacon .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(224, 162, 74, .32);
      animation: sweep 3.4s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .beacon .ring.b { animation-delay: -1.7s; border-color: rgba(47, 111, 126, .3); }
    @keyframes sweep {
      0%   { transform: scale(.42); opacity: 0; }
      30%  { opacity: .9; }
      100% { transform: scale(1.05); opacity: 0; }
    }

    h1 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 30px; font-weight: 600; letter-spacing: .04em;
    }
    .sub {
      margin: 0 0 26px;
      font-size: 14px; line-height: 1.85; color: var(--gauge);
    }
    .sub em {
      font-style: normal; color: var(--foam);
      border-bottom: 1px solid rgba(214, 227, 224, .28);
      padding-bottom: 1px;
    }

    .btn {
      display: block; width: 100%;
      padding: 14px 20px;
      border: 1px solid var(--signal);
      border-radius: 3px;
      background: rgba(224, 162, 74, .10);
      color: var(--signal);
      font-family: var(--sans); font-size: 15px; letter-spacing: .1em;
      text-align: center; text-decoration: none;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }
    .btn:hover { background: rgba(224, 162, 74, .2); color: #fff; }

    /* 自动跳转倒计时：说清楚要发生什么，别让人措手不及 */
    .countdown {
      margin: 12px 0 0; height: 18px;
      font-size: 12px; letter-spacing: .06em; color: var(--dim);
      text-align: center;
    }
    .countdown a { color: var(--dim); text-decoration: underline; }

    /* 完整链接：明面摆出来，让人能自己复制。这是最可靠的一手。
       链接独占一行——URL 有六十多个字符，跟按钮挤在一行必然被截断。 */
    .fallback {
      margin-top: 26px; padding-top: 22px;
      border-top: 1px solid var(--line);
    }
    .fallback h2 {
      margin: 0 0 6px;
      font-size: 11px; font-weight: 500; letter-spacing: .16em;
      color: var(--dim); text-transform: uppercase;
    }
    .fallback p {
      margin: 0 0 12px; font-size: 12.5px; line-height: 1.8; color: var(--dim);
    }
    /* 链接框独占一行，复制按钮另起一行。
       URL 有六十多个字符，跟按钮并排必然被截断——而链接看不全，
       恰恰是这个页面存在的意义所在。 */
    .linkrow { display: flex; flex-wrap: wrap; gap: 8px; }
    .linkrow input {
      flex: 1 1 100%; min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line-2); border-radius: 3px;
      background: var(--panel); color: var(--foam);
      font-family: var(--mono); font-size: 12px;
    }
    .copy-btn {
      flex: none; padding: 9px 18px;
      border: 1px solid var(--line-2); border-radius: 3px;
      background: var(--panel); color: var(--gauge);
      font-family: var(--sans); font-size: 12.5px;
      cursor: pointer; transition: color .2s ease, border-color .2s ease;
    }
    .copy-btn:hover { color: var(--foam); border-color: var(--gauge); }
    .copy-btn.ok { color: var(--alive); border-color: rgba(111, 208, 140, .5); }

    .foot {
      margin-top: 24px;
      font-size: 11.5px; line-height: 1.9; color: #3E4E52;
    }
    .foot code {
      font-family: var(--mono); font-size: 11px;
      color: var(--dim);
    }

    @media (max-width: 520px) {
      h1 { font-size: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .beacon .ring { animation: none; opacity: .4; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="beacon" aria-hidden="true">
      <div class="ring"></div>
      <div class="ring b"></div>
      <div class="core"></div>
    </div>

    <h1>正在登岛</h1>
    <p class="sub">
      这里是<em>孤岛浪花</em>的真实版——全球共享的同一片卡片海。<br/>
      把你写下的卡片放进去，它会被某一个人看到一次，然后永远退去。
    </p>

    <!-- 目标链接由脚本在运行时拼出，页面上不预置任何参数 -->
    <a class="btn" id="enter" href="#">进入孤岛浪花 →</a>
    <!-- 倒计时文案由脚本填。这里不要留静态文本：
         它会成为 <p> 的直接文本节点，appendChild 清不掉，
         会和脚本写的文字并排显示成两句话。 -->
    <p class="countdown" id="countdown"></p>

    <div class="fallback">
      <h2>如果按钮没反应</h2>
      <p>完整链接在下面，复制它到浏览器地址栏打开即可。<br/>
         （微信里直接打开有时会被拦，复制出来反而更稳。）</p>
      <div class="linkrow">
        <input id="full-url" readonly aria-label="完整链接" />
        <button class="copy-btn" id="copy-btn" type="button">复制</button>
      </div>
    </div>

    <p class="foot">
      <code>sharecode</code> 是这一片海的钥匙。带它进一次，之后一个月内这台设备
      不再需要钥匙——所以你复制出去的链接哪怕被截断，收到的人也可以先来这一页取。
    </p>
  </div>

  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';

    /* 真实版托管域 + 访问钥匙。
       从 config.js 读（唯一真源），读不到就用兜底值——
       中转页是"最后一根救命稻草"，不能因为一个脚本没加载就彻底瘫掉。
       两者都在运行时拼接，页面 URL 本身不含任何 query 参数——
       这样这个链接被聊天工具转发时，没有参数可被截断。 */
    var cfg = window.ISLAND_CONFIG || {};
    var HOST = 'island-wave-cards.app.workbuddy.host';
    var KEY  = 'R7PJGFFCEZ';
    var ENDPOINT = cfg.endpoint || ('https://' + HOST);
    var SHARE = cfg.shareCode || KEY;
    var TARGET = ENDPOINT.replace(/\/+$/, '') + '/?sharecode=' + encodeURIComponent(SHARE);

    var input = document.getElementById('full-url');
    var enter = document.getElementById('enter');
    var countEl = document.getElementById('countdown');
    var copyBtn = document.getElementById('copy-btn');

    input.value = TARGET;
    enter.href = TARGET;

    /* ---------- 复制 ----------
       execCommand 是老 API，但在这类场景里最稳
       （navigator.clipboard 在非 HTTPS 或旧内核上会失败） */
    function flashOk() {
      copyBtn.textContent = '已复制';
      copyBtn.classList.add('ok');
      setTimeout(function () {
        copyBtn.textContent = '复制';
        copyBtn.classList.remove('ok');
      }, 1800);
    }
    function doCopy() {
      input.focus();
      input.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (!ok && navigator.clipboard) {
        navigator.clipboard.writeText(TARGET).then(flashOk, function () {});
        return;
      }
      if (ok) flashOk();
      else input.select();   /* 兜底：至少把文字选中，让用户自己按 Ctrl+C */
    }

    /* ---------- 自动跳转 ----------
       多数人只是想赶紧进去，所以 3 秒后自动送他一程。
       但「想复制链接」和「想被跳走」是两种意图——
       一旦用户点了复制、点了按钮或聚焦了链接框，
       就说明他不想被自动带走，这时立刻收回自动跳转。 */
    var LEFT = 3;
    var timer = null;
    var cancelled = false;

    /* 倒计时的 DOM 只建一次，之后只改文本 */
    var countText = document.createElement('span');
    var cancelLink = document.createElement('a');
    cancelLink.href = '#';
    cancelLink.textContent = '取消';
    cancelLink.addEventListener('click', function (e) {
      e.preventDefault();
      stopAuto();
    });
    countEl.appendChild(countText);
    countEl.appendChild(cancelLink);

    function stopAuto() {
      if (cancelled) return;
      cancelled = true;
      if (timer) { clearInterval(timer); timer = null; }
      countText.textContent = '自动跳转已取消。';
    }

    function tick() {
      if (cancelled) return;
      LEFT--;
      if (LEFT <= 0) {
        if (timer) { clearInterval(timer); timer = null; }
        countText.textContent = '正在进入…';
        cancelLink.style.display = 'none';
        /* location.replace 而不是 location.href：
           中转页不该留在历史里，用户回退时不该再跳一次。 */
        location.replace(TARGET);
        return;
      }
      countText.textContent = LEFT + ' 秒后自动进入 · ';
    }

    copyBtn.addEventListener('click', function () { stopAuto(); doCopy(); });
    enter.addEventListener('click', function () { stopAuto(); });
    input.addEventListener('focus', function () { stopAuto(); });

    countText.textContent = LEFT + ' 秒后自动进入 · ';
    timer = setInterval(tick, 1000);
  })();
  </script>
</body>
</html>
